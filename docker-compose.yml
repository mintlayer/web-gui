x-common: &common
  volumes:
    - "./mintlayer-data:/home/mintlayer"
  restart: unless-stopped

x-common-env: &common-env
  ML_USER_ID: "${ML_USER_ID:-1000}"
  ML_GROUP_ID: "${ML_GROUP_ID:-1000}"

# Both mainnet and testnet env vars are set to the same credential values.
# Only the vars matching the active NETWORK are picked up by each daemon.
x-node-rpc-env: &node-rpc-env
  ML_MAINNET_NODE_RPC_USERNAME: "${NODE_RPC_USERNAME}"
  ML_MAINNET_NODE_RPC_PASSWORD: "${NODE_RPC_PASSWORD}"
  ML_TESTNET_NODE_RPC_USERNAME: "${NODE_RPC_USERNAME}"
  ML_TESTNET_NODE_RPC_PASSWORD: "${NODE_RPC_PASSWORD}"

services:
  # ─────────────────────────────────────────
  # Core: Mintlayer full node
  # ─────────────────────────────────────────
  node-daemon:
    <<: *common
    # Images update via Watchtower (opt-in, profile "watchtower") or manual pulls.
    # For strict supply-chain pinning, set ML_*_IMAGE env overrides to a
    # digest-pinned ref, e.g. ML_NODE_DAEMON_IMAGE=mintlayer/node-daemon@sha256:<digest>.
    image: "${ML_NODE_DAEMON_IMAGE:-ghcr.io/mintlayer/web-gui/node-daemon:latest}"
    command: "node-daemon ${NETWORK:-mainnet}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      <<: [*common-env, *node-rpc-env]
      RUST_LOG: "${RUST_LOG:-info}"
      ML_MAINNET_NODE_RPC_BIND_ADDRESS: "0.0.0.0:3030"
      ML_TESTNET_NODE_RPC_BIND_ADDRESS: "0.0.0.0:3030"
    # Uncomment to expose the node RPC to the host
    # ports:
    #   - "3030:3030"

  # ─────────────────────────────────────────
  # Core: Wallet RPC daemon (headless wallet)
  #
  # WALLET_RPC_CMD is written by init.sh (network only, e.g. "wallet-rpc-daemon mainnet").
  # Wallet files are managed via the web UI — no --wallet-file flag needed.
  # ─────────────────────────────────────────
  wallet-rpc-daemon:
    <<: *common
    image: "${ML_WALLET_RPC_DAEMON_IMAGE:-ghcr.io/mintlayer/web-gui/wallet-rpc-daemon:latest}"
    command: "${WALLET_RPC_CMD:-wallet-rpc-daemon mainnet}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      - node-daemon
    environment:
      <<: *common-env
      RUST_LOG: "${RUST_LOG:-info}"
      # Mainnet
      ML_MAINNET_WALLET_RPC_DAEMON_NODE_RPC_ADDRESS: "node-daemon:3030"
      ML_MAINNET_WALLET_RPC_DAEMON_NODE_RPC_USERNAME: "${NODE_RPC_USERNAME}"
      ML_MAINNET_WALLET_RPC_DAEMON_NODE_RPC_PASSWORD: "${NODE_RPC_PASSWORD}"
      ML_MAINNET_WALLET_RPC_DAEMON_RPC_BIND_ADDRESS: "0.0.0.0:3034"
      ML_MAINNET_WALLET_RPC_DAEMON_RPC_USERNAME: "${WALLET_RPC_USERNAME}"
      ML_MAINNET_WALLET_RPC_DAEMON_RPC_PASSWORD: "${WALLET_RPC_PASSWORD}"
      # Testnet
      ML_TESTNET_WALLET_RPC_DAEMON_NODE_RPC_ADDRESS: "node-daemon:3030"
      ML_TESTNET_WALLET_RPC_DAEMON_NODE_RPC_USERNAME: "${NODE_RPC_USERNAME}"
      ML_TESTNET_WALLET_RPC_DAEMON_NODE_RPC_PASSWORD: "${NODE_RPC_PASSWORD}"
      ML_TESTNET_WALLET_RPC_DAEMON_RPC_BIND_ADDRESS: "0.0.0.0:3034"
      ML_TESTNET_WALLET_RPC_DAEMON_RPC_USERNAME: "${WALLET_RPC_USERNAME}"
      ML_TESTNET_WALLET_RPC_DAEMON_RPC_PASSWORD: "${WALLET_RPC_PASSWORD}"
    restart: on-failure
    # ports:
    #   - "3034:3034"

  # ─────────────────────────────────────────
  # Web GUI (Astro SSR app)
  # ─────────────────────────────────────────
  web-gui:
    # Prebuilt multi-arch image from CI (amd64+arm64). Override the ref or
    # run `docker compose build` to compile locally instead.
    image: "${WEB_GUI_IMAGE:-ghcr.io/mintlayer/web-gui/web-gui:latest}"
    build:
      context: ./app
      dockerfile: Dockerfile
    # Run as the host user that owns ./mintlayer-data (never root).
    # Falls back to the image's unprivileged app user (10001).
    user: "${ML_USER_ID:-10001}:${ML_GROUP_ID:-10001}"
    depends_on:
      - wallet-rpc-daemon
    volumes:
      # Access to wallet data: backup download (read) and wallet file deletion during seed import (write)
      - "./mintlayer-data:/app/mintlayer-data"
      # Shared with wallet-rpc-daemon's /home/mintlayer/ so uploaded wallet files
      # are accessible to the daemon at /home/mintlayer/uploads/<filename>
      - "./mintlayer-data/uploads:/app/uploads"
      # Server-side preferences (SQLite) — persists across browsers and restarts
      - "./mintlayer-data/prefs:/app/prefs"
      # Installed plugins — persists across restarts
      - "./mintlayer-data/plugins:/app/plugins"
    ports:
      - "${WEB_GUI_BIND:-127.0.0.1}:${WEB_GUI_PORT:-4321}:4321"  # loopback by default; opt in via WEB_GUI_BIND
    environment:
      WALLET_RPC_URL: "http://wallet-rpc-daemon:3034"
      WALLET_RPC_USERNAME: "${WALLET_RPC_USERNAME}"
      WALLET_RPC_PASSWORD: "${WALLET_RPC_PASSWORD}"
      NODE_RPC_URL: "http://node-daemon:3030"
      NODE_RPC_USERNAME: "${NODE_RPC_USERNAME}"
      NODE_RPC_PASSWORD: "${NODE_RPC_PASSWORD}"
      NETWORK: "${NETWORK:-mainnet}"
      INDEXER_URL: "http://api-web-server:3000"
      PINATA_JWT: "${PINATA_JWT:-}"
      IPFS_PROVIDER: "${IPFS_PROVIDER:-}"
      FILEBASE_TOKEN: "${FILEBASE_TOKEN:-}"
      SESSION_SECRET: "${SESSION_SECRET}"
      WALLET_RPC_CMD: "${WALLET_RPC_CMD:-}"
      INDEXER_ENABLED: "${INDEXER_ENABLED:-false}"
      BITCOIN_ENABLED: "${BITCOIN_ENABLED:-false}"
      BITCOIN_NETWORK: "${BITCOIN_NETWORK:-}"
      BITCOIN_WALLET_URL: "http://bdk-wallet:8080"
      BITCOIN_WALLET_USERNAME: "${BITCOIN_WALLET_HTTP_USERNAME:-}"
      BITCOIN_WALLET_PASSWORD: "${BITCOIN_WALLET_HTTP_PASSWORD:-}"
      BITCOIN_EXPLORER_URL: "${BITCOIN_EXPLORER_URL:-}"
      HOST: "0.0.0.0"
      PORT: "4321"
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Optional: Bitcoin Core node  (profile: bitcoin)
  #
  # Chain data + tx broadcast for the BTC wallet. No host ports by default.
  # Pinned to Core 25: bdk's rpc backend (core-rpc 0.17) cannot parse the
  # `warnings` array format introduced in Core 26.
  # Start with: docker compose --profile bitcoin up -d
  # ─────────────────────────────────────────
  bitcoind:
    image: "${BITCOIND_IMAGE:-bitcoin/bitcoin:25}"
    volumes:
      - "./bitcoin-data:/home/bitcoin/.bitcoin"
    command:
      - "-printtoconsole=1"
      - "-chain=${BITCOIN_NETWORK:-mainnet}"
      - "-rpcbind=0.0.0.0:8332"
      - "-rpcallowip=0.0.0.0/0"
      - "-rpcuser=${BITCOIN_RPC_USERNAME}"
      - "-rpcpassword=${BITCOIN_RPC_PASSWORD}"
      # txindex is required by the BDK wallet to resolve historical
      # transactions; pruning is incompatible with the wallet history sync.
      - "-txindex=${BITCOIN_TXINDEX:-1}"
      - "-prune=${BITCOIN_PRUNE:-0}"
      - "-fallbackfee=0.0002"
    # Uncomment to expose the Bitcoin RPC to the host
    # ports:
    #   - "8332:8332"
    profiles:
      - bitcoin
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Optional: BTC block explorer  (profile: bitcoin)
  #
  # btc-rpc-explorer, wired to the local bitcoind. Gives the web-gui
  # something to link txs/addresses to on regtest, where no public
  # explorer exists. Published to loopback only; public networks default
  # to mempool.space links instead (override with BITCOIN_EXPLORER_URL).
  # ─────────────────────────────────────────
  btc-explorer:
    image: "${BTC_EXPLORER_IMAGE:-ghcr.io/mintlayer/web-gui/btc-explorer:latest}"
    build:
      context: ./btc-explorer
      args:
        BTC_RPC_EXPLORER_REF: "${BTC_RPC_EXPLORER_REF:-v3.5.1}"
    depends_on:
      - bitcoind
    environment:
      BTCEXP_BITCOIND_URI: "bitcoin://${BITCOIN_RPC_USERNAME}:${BITCOIN_RPC_PASSWORD}@bitcoind:8332?timeout=15000"
      BTCEXP_HOST: "0.0.0.0"
      BTCEXP_PORT: "3002"
      BTCEXP_ADDRESS_API: "none"
    ports:
      - "127.0.0.1:${BITCOIN_EXPLORER_PORT:-3002}:3002"
    profiles:
      - bitcoin
    restart: unless-stopped
  # ─────────────────────────────────────────
  # Optional: BDK Bitcoin wallet sidecar  (profile: bitcoin)
  #
  # Light wallet (BIP84) holding the BTC keys; talks to bitcoind for chain
  # data and broadcasting. The web-gui proxies all requests to its HTTP API.
  # Secrets never leave this container; only the compose network can reach it.
  # ─────────────────────────────────────────
  bdk-wallet:
    build: ./bdk-wallet
    image: "${BDK_WALLET_IMAGE:-ghcr.io/mintlayer/web-gui/bdk-wallet:latest}"
    # Match the bind-mount owner (init.sh pre-creates ./bitcoin-wallet-data
    # as the host user; ML_USER_ID/GROUP_ID follow the host user like web-gui).
    user: "${ML_USER_ID:-1000}:${ML_GROUP_ID:-1000}"
    depends_on:
      - bitcoind
    volumes:
      - "./bitcoin-wallet-data:/data"
    environment:
      BITCOIN_NETWORK: "${BITCOIN_NETWORK:-mainnet}"
      BITCOIN_RPC_URL: "http://bitcoind:8332"
      BITCOIN_RPC_USERNAME: "${BITCOIN_RPC_USERNAME}"
      BITCOIN_RPC_PASSWORD: "${BITCOIN_RPC_PASSWORD}"
      WALLET_HTTP_USERNAME: "${BITCOIN_WALLET_HTTP_USERNAME}"
      WALLET_HTTP_PASSWORD: "${BITCOIN_WALLET_HTTP_PASSWORD}"
      DATA_DIR: "/data"
      RUST_LOG: "${RUST_LOG:-info}"
    profiles:
      - bitcoin
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Optional: Watchtower — auto-update Mintlayer images  (profile: watchtower)
  # Checks Docker Hub daily at 04:00 and restarts any container whose image
  # has changed. The web-gui (locally built) is intentionally excluded.
  # Start with: docker compose --profile watchtower up -d
  # ─────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --schedule "0 0 4 * * *"
      --cleanup
      --label-enable
    environment:
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_NOTIFICATION_URL: "${WATCHTOWER_NOTIFICATION_URL:-}"
    profiles:
      - watchtower
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Optional: wallet-cli  (profile: wallet_cli)
  # Usage: docker compose run --rm wallet-cli
  # ─────────────────────────────────────────
  wallet-cli:
    <<: *common
    image: "${ML_WALLET_CLI_IMAGE:-mintlayer/wallet-cli:latest}"
    command: "wallet-cli"
    depends_on:
      - wallet-rpc-daemon
    environment:
      <<: *common-env
      ML_WALLET_REMOTE_RPC_WALLET_ADDRESS: "wallet-rpc-daemon:3034"
      ML_WALLET_REMOTE_RPC_WALLET_USERNAME: "${WALLET_RPC_USERNAME}"
      ML_WALLET_REMOTE_RPC_WALLET_PASSWORD: "${WALLET_RPC_PASSWORD}"
    profiles:
      - wallet_cli

  # ─────────────────────────────────────────
  # Optional: Indexer stack  (profile: indexer)
  # Start with: docker compose --profile indexer up -d
  # ─────────────────────────────────────────
  postgres:
    image: "postgres:16-alpine"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mintlayer}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      POSTGRES_DB: "${POSTGRES_DB:-mintlayer}"
    profiles:
      - indexer
    restart: unless-stopped

  api-blockchain-scanner-daemon:
    <<: *common
    image: "${ML_API_SCANNER_IMAGE:-ghcr.io/mintlayer/web-gui/api-blockchain-scanner-daemon:latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      - node-daemon
      - postgres
    environment:
      <<: *common-env
      RUST_LOG: "${RUST_LOG:-info}"
      ML_API_SCANNER_DAEMON_NETWORK: "${NETWORK:-mainnet}"
      ML_API_SCANNER_DAEMON_NODE_RPC_ADDRESS: "node-daemon:3030"
      ML_API_SCANNER_DAEMON_NODE_RPC_USERNAME: "${NODE_RPC_USERNAME}"
      ML_API_SCANNER_DAEMON_NODE_RPC_PASSWORD: "${NODE_RPC_PASSWORD}"
      ML_API_SCANNER_DAEMON_POSTGRES_HOST: "postgres"
      ML_API_SCANNER_DAEMON_POSTGRES_USER: "${POSTGRES_USER:-mintlayer}"
      ML_API_SCANNER_DAEMON_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      ML_API_SCANNER_DAEMON_POSTGRES_DATABASE: "${POSTGRES_DB:-mintlayer}"
    profiles:
      - indexer
    restart: unless-stopped

  api-web-server:
    image: "${ML_API_WEB_SERVER_IMAGE:-ghcr.io/mintlayer/web-gui/api-web-server:latest}"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      - postgres
      - node-daemon
    ports:
      - "${API_WEB_SERVER_PORT:-3000}:3000"
    environment:
      ML_API_WEB_SRV_NETWORK: "${NETWORK:-mainnet}"
      ML_API_WEB_SRV_BIND_ADDRESS: "0.0.0.0:3000"
      ML_API_WEB_SRV_NODE_RPC_ADDRESS: "node-daemon:3030"
      ML_API_WEB_SRV_NODE_RPC_USERNAME: "${NODE_RPC_USERNAME}"
      ML_API_WEB_SRV_NODE_RPC_PASSWORD: "${NODE_RPC_PASSWORD}"
      ML_API_WEB_SRV_POSTGRES_HOST: "postgres"
      ML_API_WEB_SRV_POSTGRES_USER: "${POSTGRES_USER:-mintlayer}"
      ML_API_WEB_SRV_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      ML_API_WEB_SRV_POSTGRES_DATABASE: "${POSTGRES_DB:-mintlayer}"
    profiles:
      - indexer
    restart: unless-stopped

volumes:
  postgres-data:
