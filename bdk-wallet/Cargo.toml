[package]
name = "bdk-wallet"
version = "0.1.0"
edition = "2021"
description = "Minimal BDK-based Bitcoin wallet HTTP sidecar for mintlayer web-gui"
publish = false

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
bip39 = "2"
rand = "0.8"
bdk = { version = "0.29", features = ["sqlite", "rpc"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true

# Vendored jsonrpc 0.13.0 with the per-request timeout raised from 15s to 120s.
# bdk 0.29's rpc backend imports ~200 watch-only descriptors (its hardcoded
# 100-per-keychain cache) in a single `importdescriptors` call; on modest
# hardware that exceeds 15s, so the sync would abort before ever completing.
[patch.crates-io]
jsonrpc = { path = "vendor/jsonrpc" }
